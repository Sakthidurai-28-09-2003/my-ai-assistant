{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <script>
        (function () {
            const theme = localStorage.getItem("theme") || "light";

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );
        })();
    </script>

    <link rel="stylesheet"
          href="{% static 'assistant/style.css' %}">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>Create account</h1>

        <p>Start using My AI</p>

        {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p>
            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</div>

</body>
</html>
