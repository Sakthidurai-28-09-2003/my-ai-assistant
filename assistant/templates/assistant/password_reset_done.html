{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Reset Email Sent</title>
    <script>
        (function () {
            const theme = localStorage.getItem("theme") || "light";

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );
        })();
    </script>
    <link rel="stylesheet" href="{% static 'assistant/style.css' %}">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>Check your email</h1>

        <p>
            If an account exists with the email address you entered,
            we've sent a password reset link.
        </p>

        <p>
            Please check your inbox and spam folder.
        </p>

        <a href="{% url 'login' %}">
            Back to Login
        </a>

    </div>

</div>

</body>
</html>
