<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    
    <script>
        (function () {
            const theme = localStorage.getItem("theme") || "light";

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #161616;
            color: #ffffff;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: #202020;
            border: 1px solid #383838;
            border-radius: 18px;
            padding: 38px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            text-align: center;
        }

        .subtitle {
            color: #9a9a9a;
            text-align: center;
            line-height: 1.5;
            margin: 12px 0 28px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="email"] {
            width: 100%;
            height: 52px;
            padding: 0 15px;

            border: 1px solid #444444;
            border-radius: 10px;

            background: #181818;
            color: #ffffff;

            font-size: 16px;
            outline: none;
        }

        input[type="email"]:focus {
            border-color: #777777;
        }

        button {
            width: 100%;
            height: 52px;

            margin-top: 20px;

            border: none;
            border-radius: 10px;

            background: #0e0e0e;
            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #000000;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;

            color: #bcbcbc;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Reset password</h1>

        <p class="subtitle">
            Enter your email address and we'll send you a reset link.
        </p>

        <form method="POST">
            {% csrf_token %}

            <label for="email">
                Email address
            </label>

            <input
                id="email"
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                Send Reset Link
            </button>
        </form>

        <a href="{% url 'login' %}" class="back">
            Back to Login
        </a>

    </div>

</body>
</html>
