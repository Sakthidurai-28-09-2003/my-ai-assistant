{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <script>
        (function () {
            const theme = localStorage.getItem("theme") || "light";

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );
        })();
    </script>

    <link
        rel="stylesheet"
        href="{% static 'assistant/style.css' %}"
    >
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>Reset password</h1>

        <p>
            Enter your email address and we'll send you a reset link.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.email }}

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <p>
            <a href="{% url 'login' %}">
                Back to Login
            </a>
        </p>

    </div>

</div>

</body>
</html>
